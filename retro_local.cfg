; Commands of this machine for the "Retro" run button (see addons/retro_runtime/runner.gd).
; Compilers and emulators are somewhere else on every machine: do not share this file.
; [<platform>.<os>] is read on that system only (windows, linux, macos).

[pc.windows]

build=["C:/msys64/usr/bin/env.exe", "PATH=/mingw64/bin:/usr/bin", "mingw32-make", "-C", "{project}"]

[pc.linux]

build=["make", "-C", "{project}"]

[dreamcast.windows]

; WSL. PADDING=0 writes a 13 MB image instead of a whole disc of 740 MB, which took over a
; minute onto the Windows drive; -j8 compiles on all cores.
build=["wsl", "-d", "Ubuntu-24.04", "--cd", "{project}", "--", "bash", "-c", "source /opt/toolchains/dc/kos/environ.sh && make -j8 -C runtime/platform/dreamcast cdi MKDCDISC=/home/memorix101/.local/bin/mkdcdisc PADDING=0 BOOT={scene}"]
run=["C:/msys64_dc/x/home/dcemu/flycast-dev.exe", "{project}/build/dc/retro.cdi"]


[dreamcast.linux]

build=["bash", "-c", "source /opt/toolchains/dc/kos/environ.sh && make -C {project}/runtime/platform/dreamcast cdi BOOT={scene}"]
; env: the AppImage then runs without FUSE (libfuse2), which this machine does not have
run=["/usr/bin/env", "APPIMAGE_EXTRACT_AND_RUN=1", "/home/memorix101/flycast-x86_64-2.7.appimage", "{project}/build/dc/retro.cdi"]

[psp.windows]

; WSL, with the PSP SDK in ~/pspdev. The game is the folder build/psp/retro.
build=["wsl", "-d", "Ubuntu-24.04", "--cd", "{project}", "--", "bash", "-c", "export PSPDEV=~/pspdev PATH=~/pspdev/bin:/usr/local/bin:/usr/bin:/bin && make -j8 -C runtime/platform/psp game BOOT={scene}"]
run=["E:/Emulator/PSP/ppsspp_1.20.4/PPSSPPWindows64.exe", "{project}/build/psp/retro/EBOOT.PBP"]

[wii.windows]

; devkitPro's Docker image builds; build/wii/sd is the SD card. Dolphin runs with its usual
; settings (controllers and all); only the SD card is another one for this start: -C sets
; a setting without saving it.
build=["docker", "run", "--rm", "-v", "{project}:/src", "-w", "/src", "devkitpro/devkitppc:latest", "make", "-j8", "-C", "runtime/platform/wii", "game", "BOOT={scene}"]
run=["E:/Emulator/Dolphin-x64/Dolphin.exe", "-C", "Dolphin.Core.WiiSDCard=True", "-C", "Dolphin.Core.WiiSDCardEnableFolderSync=True", "-C", "Dolphin.General.WiiSDCardSyncFolder={project}/build/wii/sd", "-C", "Dolphin.General.WiiSDCardPath={project}/build/wii/sd.raw", "-b", "-e", "{project}/build/wii/sd/apps/retro/boot.dol"]
