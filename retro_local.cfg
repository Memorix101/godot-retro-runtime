[pc]

build=["C:/msys64/usr/bin/env.exe", "PATH=/mingw64/bin:/usr/bin", "mingw32-make", "-C", "{project}"]

[dreamcast]

build=["wsl", "-d", "Ubuntu-24.04", "--cd", "{project}", "--", "bash", "-c", "source /opt/toolchains/dc/kos/environ.sh && make -C runtime/platform/dreamcast cdi MKDCDISC=/home/memorix101/.local/bin/mkdcdisc BOOT={scene}"]
run=["C:/msys64_dc/x/home/dcemu/flycast-dev.exe", "{project}/build/dc/retro.cdi"]
